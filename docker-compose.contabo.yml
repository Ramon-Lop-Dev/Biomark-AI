# Servicios alojados en Contabo. El ai-service se ejecuta por separado en RunPod.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: ./deploy/backend.env
    restart: unless-stopped
    networks: [biomark]

  n8n:
    image: n8nio/n8n:1.123.77
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://biomark-n8n.duckdns.org/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://biomark-n8n.duckdns.org/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: sqlite
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Managua}
      TZ: ${TZ:-America/Managua}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks: [biomark]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, n8n]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [biomark]

volumes:
  n8n_data:

networks:
  biomark:
    driver: bridge
