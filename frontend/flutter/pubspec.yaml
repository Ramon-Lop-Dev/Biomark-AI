name: flutter_biomark
description: "Proyecto Biomark AI creada por el grupo MARK, hecha para la ayuda a las personas que necesitan apoyo en momentos de tension cuando estan enfermos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  camera: ^0.12.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  http: ^1.5.0
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  record: ^6.1.2
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  app_links: ^6.3.2
  flutter_dotenv: ^5.1.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.4
  url_launcher: ^6.3.2
  sensors_plus: ^7.1.0
  flutter_tts: ^4.2.5
  http_parser: ^4.1.2
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/Icono.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/Icono.png

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logosecun.png
    - assets/branding/
    - assets/lottie/

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold_2.ttf
          weight: 700