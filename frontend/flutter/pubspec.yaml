name: flutter_biomark
description: "Proyecto Biomark AI creada por el grupo MARK, hecha para la ayuda a las personas que necesitan apoyo en momentos de tension cuando estan enfermos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  http: ^1.5.0
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  record: ^6.1.2
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logosecun.png
    - assets/branding/

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold_2.ttf
          weight: 700