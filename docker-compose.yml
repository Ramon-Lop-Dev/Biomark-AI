# Orquesta backend, AI Service, n8n y nginx en una red privada del VPS.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: ./deploy/backend.env
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [biomark]

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    env_file: ./deploy/ai-service.env
    volumes:
      - ai_models:/root/.cache/huggingface
      - ai_rag:/app/chroma_db
    restart: unless-stopped
    networks: [biomark]

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=sqlite
      - N8N_SECURE_COOKIE=true
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks: [biomark]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, ai-service, n8n]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [biomark]

volumes:
  ai_models:
  ai_rag:
  n8n_data:

networks:
  biomark:
    driver: bridge
